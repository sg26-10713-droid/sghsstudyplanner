<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>성광고 학습 플랫폼</title>
  <!-- Tailwind CSS CDN (유일한 외부 의존성) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes popIn { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: none; } }
    .animate-fade { animation: fadeIn 0.18s ease-out; }
    .animate-pop { animation: popIn 0.22s cubic-bezier(0.16, 1, 0.3, 1); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
  <!-- 메인 앱 렌더링 컨테이너 -->
  <div id="app"></div>

  <script>
    /* ==========================================================================
       성광고 학습 플랫폼 - 순수 바닐라 JS 엔진 (Babel/외부 모듈 의존성 0%)
       ========================================================================== */

    // 1. 상수 정의
    const SCHOOL_CODES = { "3135": "student", "5131": "admin" };
    const GRADES = [1, 2, 3];
    const CLASSES = Array.from({ length: 12 }, (_, i) => i + 1);
    const SUBJECTS = ["국어", "수학", "영어", "한국사", "통합사회", "통합과학", "물리학", "화학", "생명과학", "지구과학", "정보", "음악", "미술", "체육", "진로", "기타"];
    const PRIORITIES = [
      { key: "high", label: "높음", chip: "bg-rose-100 text-rose-700 border-rose-200", rank: 0 },
      { key: "mid",  label: "보통", chip: "bg-amber-100 text-amber-700 border-amber-200", rank: 1 },
      { key: "low",  label: "낮음", chip: "bg-sky-100 text-sky-700 border-sky-200", rank: 2 },
    ];
    const BASE_TABS = [
      { key: "planner",     label: "나만의 맞춤 학습 플래너", icon: "📅" },
      { key: "materials",   label: "수업 자료실",             icon: "📁" },
      { key: "assignments", label: "수행평가 일정",           icon: "📝" },
      { key: "examscope",   label: "시험 범위",               icon: "🎯" },
      { key: "books",       label: "추천 교재/족보",          icon: "⭐" },
    ];
    const ADMIN_TAB = { key: "requests", label: "학생 요청사항 관리", icon: "📬" };
    const POST_TABS = ["materials", "assignments", "examscope", "books"];

    const BANNED = ["시발", "씨발", "ㅅㅂ", "병신", "ㅂㅅ", "ㅄ", "존나", "ㅈㄴ", "개새", "미친놈", "꺼져", "ㄲㅈ", "죽어라", "찐따", "빡대가리", "멍청이", "등신", "니애미", "야동", "도박", "지랄", "엿먹"];
    const JOKE = ["장난", "ㅋㅋ", "ㅎㅎ", "ㅠㅠ", "ㅜㅜ", "ㄱㄱ", "ㄴㄴ", "ㅇㅇ", "asdf", "ㅁㄴㅇㄹ", "qwer", "1234567"];

    // 2. 날짜 & 유틸리티
    const pad = (n) => String(n).padStart(2, "0");
    const toDateStr = (d) => `d.getFullYear()-{pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const TODAY = toDateStr(new Date());

    const dday = (s) => {
      if (!s) return null;
      const t = new Date(`${s.slice(0, 10)}T00:00:00`);
      const n = new Date();
      n.setHours(0, 0, 0, 0);
      return Math.round((t - n) / 86400000);
    };

    const ddayLabel = (n) => (n === null ? "-" : n === 0 ? "D-DAY" : n > 0 ? `D-n`:`D+{Math.abs(n)}`);
    const fmtDate = (s) => (!s ? "-" : new Date(s).toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "short" }));
    const fmtDateTime = (s) => (!s ? "-" : new Date(s).toLocaleString("ko-KR", { month: "long", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit" }));
    const fmtSize = (b) => (!b ? "0B" : b < 1024 ? `bB`:b<1048576?`{(b / 1024).toFixed(1)}KB` : `${(b / 1048576).toFixed(2)}MB`);

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // 3. 샌드박스 안전 저장소 (LocalStorage 예외 발생 시 메모리 자동 격리)
    const memStore = {};
    const safeStore = {
      get(k, fallback) {
        try {
          const val = localStorage.getItem(k);
          return val ? JSON.parse(val) : fallback;
        } catch (e) {
          return memStore[k] !== undefined ? memStore[k] : fallback;
        }
      },
      set(k, val) {
        try {
          localStorage.setItem(k, JSON.stringify(val));
        } catch (e) {
          memStore[k] = val;
        }
      }
    };

    // 4. 시드 데이터 생성
    function makeSeed() {
      const mk = (type, obj) => ({
        id: `type-{Math.random().toString(36).slice(2, 9)}`,
        type,
        createdAt: Date.now() - Math.floor(Math.random() * 86400000),
        ...obj,
      });
      const Y = new Date().getFullYear();
      const out = { materials: [], assignments: [], examscope: [], books: [] };

      GRADES.forEach((g) => {
        out.materials.push(
          mk("materials", { title: `${g}학년 수학 - 삼각함수 핵심 요약 프린트`, subject: "수학", content: "수업 중 배부된 요약본입니다. 개념 정리 및 대표 유형 12선이 포함되어 있습니다.", grade: g, classNum: 0, file: null, fileName: "", fileType: "", fileSizeB: 0, authorId: "__seed__", authorName: "교무부", authorGrade: g, authorClass: 0, authorRole: "admin" }),
          mk("materials", { title: `${g}학년 영어 본문 구문 분석 (Lesson 5)`, subject: "영어", content: "Lesson 5 본문 어휘 및 어법 핵심 정리 자료입니다. 시험 대비용으로 활용하세요.", grade: g, classNum: 8, file: null, fileName: "", fileType: "", fileSizeB: 0, authorId: "__seed__", authorName: "김서연", authorGrade: g, authorClass: 8, authorRole: "student" }),
          mk("materials", { title: `${g}학년 3반 국어 수업 필기본 공유`, subject: "국어", content: "3반 전용 문학 수업 필기본입니다.", grade: g, classNum: 3, file: null, fileName: "", fileType: "", fileSizeB: 0, authorId: "__seed__", authorName: "박준서", authorGrade: g, authorClass: 3, authorRole: "student" })
        );
        out.assignments.push(
          mk("assignments", { title: `g학년국어-비평문작성수행평가`,subject:"국어",content:"제시된문학작품중1편을선택하여A42매분량으로작성후기한내제출하세요.",grade:g,classNum:0,due:`{Y}-11-15T18:00`, authorId: "__seed__", authorName: "교무부", authorGrade: g, authorClass: 0, authorRole: "admin" }),
          mk("assignments", { title: `g학년8반과학탐구실험보고서`,subject:"통합과학",content:"조별탐구실험결과분석및토의보고서를제출합니다.",grade:g,classNum:8,due:`{Y}-11-20T23:59`, authorId: "__seed__", authorName: "박지훈", authorGrade: g, authorClass: 8, authorRole: "student" })
        );
        out.examscope.push(
          mk("examscope", { title: `${g}학년 2학기 기말고사 - 수학 범위`, subject: "수학", content: "교과서 p.110~175 / 학습지 1~6회차 전체 / 서술형 4문항 출제 예정", grade: g, classNum: 0, authorId: "__seed__", authorName: "교무부", authorGrade: g, authorClass: 0, authorRole: "admin" })
        );
        out.books.push(
          mk("books", { title: "쎈 수학 (고등) - 유형 반복 학습 추천", subject: "수학", bookType: "추천 교재", content: "내신 빈출 유형 훈련에 최적화된 교재입니다. B단계 유형 반복 풀이를 권장합니다.", grade: g, classNum: 0, authorId: "__seed__", authorName: "이도현", authorGrade: g, authorClass: 3, authorRole: "student" }),
          mk("books", { title: `${g}학년 1학기 기말 기출 족보 정리본`, subject: "기타", bookType: "족보", content: "작년 기출 문항 중 고난도 서술형 위주 정리 파일입니다.", grade: g, classNum: 8, authorId: "__seed__", authorName: "최유진", authorGrade: g, authorClass: 8, authorRole: "student" })
        );
      });
      return out;
    }

    function defaultPlanner() {
      const y = new Date().getFullYear();
      return {
        todos: [
          { id: "t1", text: "수학 쎈 3단원 유형 25~40번 풀기", subject: "수학", book: "쎈 수학", unit: "3단원", priority: "high", done: false, date: TODAY },
          { id: "t2", text: "영어 Lesson 5 필수 어휘 50개 암기", subject: "영어", book: "교과서", unit: "Lesson 5", priority: "mid", done: true, date: TODAY },
          { id: "t3", text: "국어 비문학 지문 2개 분석 및 요약", subject: "국어", book: "마더텅", unit: "독서", priority: "mid", done: false, date: TODAY },
        ],
        memos: [
          { id: "m1", title: "수학 오답 - 삼각함수 그래프 주기 공식 실수", subject: "수학", content: "y = a·sin(bx + c) 에서 주기는 2π/|b|. x의 계수로 묶지 않고 계산하여 실수함. 계수 묶기 필수!", createdAt: Date.now() },
        ],
        exams: [
          { id: "e1", name: "11월 전국연합학력평가", date: `${y}-11-18` },
          { id: "e2", name: "2학기 기말고사", date: `${y}-12-15` },
        ],
      };
    }

    // 5. 전역 애플리케이션 상태 (State)
    const state = {
      users: safeStore.get("sk_users", [
        { userId: "hong", password: "1234", name: "홍길동", grade: 1, classNum: 8, role: "student" },
        { userId: "admin", password: "1234", name: "김선생", grade: 1, classNum: 1, role: "admin" },
      ]),
      currentUser: null,
      authMode: "login",
      authForm: { userId: "", password: "", password2: "", name: "", grade: 1, classNum: 1, schoolCode: "" },
      authError: "",
      
      posts: safeStore.get("sk_posts", makeSeed()),
      requests: safeStore.get("sk_requests", []),
      plannerStore: safeStore.get("sk_planner", {}),
      
      activeTab: "planner",
      showWelcome: false,
      showWidget: false,
      detail: null,
      deleteTarget: null,
      addOpen: false,
      editingPost: null,
      
      requestTarget: null,
      requestType: "삭제",
      requestReason: "",
      
      editingExam: null,
      examDraft: { name: "", date: "" },
      aiLoading: false,
      aiPlanMsg: "",
      toast: "",
      
      form: {
        title: "", subject: SUBJECTS[0], content: "", grade: 1, classNum: 0,
        due: "", bookType: "추천 교재", file: null, fileName: "", fileType: "", fileSizeB: 0
      },
      aiResult: null, // { ok: bool, tag: string, reason: string }
    };

    function saveState() {
      safeStore.set("sk_users", state.users);
      safeStore.set("sk_posts", state.posts);
      safeStore.set("sk_requests", state.requests);
      safeStore.set("sk_planner", state.plannerStore);
    }

    function showToast(msg) {
      state.toast = msg;
      render();
      setTimeout(() => {
        if (state.toast === msg) {
          state.toast = "";
          render();
        }
      }, 2300);
    }

    // AI 검수 모듈
    function aiModerate({ title = "", content = "", subject = "" }) {
      const flat = `${title} ${content}`.replace(/\s+/g, "");
      if (flat.length < 4) {
        return { ok: false, tag: "정보 부족", reason: "내용이 너무 짧습니다. 제목과 설명을 4자 이상 구체적으로 작성해 주세요." };
      }
      const jamo = (flat.match(/[ㄱ-ㅎㅏ-ㅣ]/g) || []).length;
      if (jamo / flat.length > 0.25 || /[ㄱ-ㅎㅏ-ㅣ]{3,}/.test(flat)) {
        return { ok: false, tag: "장난성 입력", reason: "자음/모음이 과도하게 포함되어 있습니다. 학습과 무관한 게시물로 분류되었습니다." };
      }
      if (/(.)\1{3,}/.test(flat)) {
        return { ok: false, tag: "도배 의심", reason: "동일한 문자가 4회 이상 반복됩니다. 도배성 게시물로 판단되었습니다." };
      }
      const ban = BANNED.find((w) => flat.includes(w));
      if (ban) {
        return { ok: false, tag: "유해 표현", reason: `부적절한 표현("${ban}")이 감지되었습니다. 학교 수칙에 따라 등록이 제한됩니다.` };
      }
      const joke = JOKE.find((w) => flat.includes(w));
      if (joke) {
        return { ok: false, tag: "주제 벗어남", reason: `장난성 키워드("${joke}")가 포함되어 있습니다. 수업/평가 관련 정보만 등록해 주세요.` };
      }
      if (!/[가-힣a-zA-Z0-9]/.test(flat)) {
        return { ok: false, tag: "형식 오류", reason: "특수문자만으로 구성된 게시물은 등록할 수 없습니다." };
      }
      return { ok: true, tag: "검수 통과", reason: `학습 관련 자료(${subject || "일반"})로 확인되었습니다. 정상 승인되었습니다.` };
    }

    // 6. 전역 앱 컨트롤러 (Window 바인딩)
    window.app = {
      setAuthMode(mode) {
        state.authMode = mode;
        state.authError = "";
        render();
      },
      quickLogin(type) {
        const u = type === "student" ? state.users[0] : state.users[1];
        window.app.doLogin(u);
      },
      doLogin(user) {
        if (!state.plannerStore[user.userId]) {
          state.plannerStore[user.userId] = defaultPlanner();
        }
        state.currentUser = user;
        state.authError = "";
        state.activeTab = "planner";
        state.showWelcome = true;
        saveState();
        render();
      },
      handleLogin(e) {
        e.preventDefault();
        const f = state.authForm;
        const found = state.users.find(u => u.userId === f.userId.trim() && u.password === f.password);
        if (!found) {
          state.authError = "아이디 또는 비밀번호가 올바르지 않습니다.";
          render();
          return;
        }
        window.app.doLogin(found);
      },
      handleSignup(e) {
        e.preventDefault();
        const f = state.authForm;
        if (!f.name.trim() || !f.userId.trim() || !f.password || !f.schoolCode.trim()) {
          state.authError = "모든 항목을 빠짐없이 입력해 주세요.";
          render();
          return;
        }
        const role = SCHOOL_CODES[f.schoolCode.trim()];
        if (!role) {
          state.authError = "학교/관리자 코드가 올바르지 않습니다. (학생: 3135, 관리자: 5131)";
          render();
          return;
        }
        if (!/^[가-힣a-zA-Z\s]{2,10}$/.test(f.name.trim())) {
          state.authError = "실명을 정확히 입력해 주세요. (한글/영문 2~10자)";
          render();
          return;
        }
        if (f.userId.trim().length < 4) {
          state.authError = "아이디는 4자 이상이어야 합니다.";
          render();
          return;
        }
        if (state.users.some(u => u.userId === f.userId.trim())) {
          state.authError = "이미 사용 중인 아이디입니다.";
          render();
          return;
        }
        if (f.password.length < 4) {
          state.authError = "비밀번호는 4자 이상이어야 합니다.";
          render();
          return;
        }
        if (f.password !== f.password2) {
          state.authError = "비밀번호 확인이 일치하지 않습니다.";
          render();
          return;
        }

        const newUser = {
          userId: f.userId.trim(),
          password: f.password,
          name: f.name.trim(),
          grade: Number(f.grade),
          classNum: Number(f.classNum),
          role,
        };
        state.users.push(newUser);
        state.authMode = "login";
        state.authError = "";
        state.authForm = { userId: newUser.userId, password: "", password2: "", name: "", grade: 1, classNum: 1, schoolCode: "" };
        saveState();
        showToast(role === "admin" ? "관리자 가입 완료! 로그인해 주세요." : "가입 완료! 로그인해 주세요.");
      },
      logout() {
        state.currentUser = null;
        state.showWelcome = false;
        state.showWidget = false;
        state.detail = null;
        state.addOpen = false;
        render();
      },
      setActiveTab(tab) {
        state.activeTab = tab;
        render();
      },
      toggleWelcome(open) {
        state.showWelcome = open;
        render();
      },
      toggleWidget() {
        state.showWidget = !state.showWidget;
        render();
      },
      // 게시물 등록/수정/삭제
      openAdd() {
        state.editingPost = null;
        state.form = {
          title: "", subject: SUBJECTS[0], content: "",
          grade: state.currentUser.grade,
          classNum: state.currentUser.role === "admin" ? 0 : state.currentUser.classNum,
          due: "", bookType: "추천 교재", file: null, fileName: "", fileType: "", fileSizeB: 0
        };
        state.aiResult = null;
        state.addOpen = true;
        render();
      },
      openEdit(type, id) {
        const p = (state.posts[type] || []).find(x => x.id === id);
        if (!p) return;
        state.editingPost = p;
        state.form = {
          title: p.title, subject: p.subject, content: p.content || "",
          grade: p.grade, classNum: p.classNum, due: p.due || "",
          bookType: p.bookType || "추천 교재",
          file: p.file || null, fileName: p.fileName || "", fileType: p.fileType || "", fileSizeB: p.fileSizeB || 0
        };
        state.detail = null;
        state.aiResult = null;
        state.addOpen = true;
        render();
      },
      closeAdd() {
        state.addOpen = false;
        state.editingPost = null;
        state.aiResult = null;
        render();
      },
      handleFileChange(e) {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        if (file.size > 8 * 1024 * 1024) {
          state.aiResult = { ok: false, tag: "용량 초과", reason: "8MB 이하의 파일만 첨부할 수 있습니다." };
          e.target.value = "";
          render();
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          state.form.file = reader.result;
          state.form.fileName = file.name;
          state.form.fileType = file.type || "application/octet-stream";
          state.form.fileSizeB = file.size;
          render();
        };
        reader.readAsDataURL(file);
      },
      submitPost(e) {
        e.preventDefault();
        state.aiResult = null;
        const type = state.editingPost ? state.editingPost.type : state.activeTab;
        const f = state.form;

        if (!f.title.trim()) {
          state.aiResult = { ok: false, tag: "입력 누락", reason: "제목을 입력해 주세요." };
          render();
          return;
        }
        if (type === "assignments" && !f.due) {
          state.aiResult = { ok: false, tag: "입력 누락", reason: "수행평가 제출 마감 기한을 지정해야 합니다." };
          render();
          return;
        }

        const verdict = aiModerate({ title: f.title, content: f.content, subject: f.subject });
        if (!verdict.ok) {
          state.aiResult = verdict;
          render();
          return;
        }

        if (state.editingPost) {
          state.posts[type] = state.posts[type].map(x => x.id === state.editingPost.id ? {
            ...x,
            title: f.title.trim(),
            subject: f.subject,
            content: f.content.trim(),
            grade: Number(f.grade),
            classNum: Number(f.classNum),
            due: f.due,
            bookType: f.bookType,
            file: f.file,
            fileName: f.fileName,
            fileType: f.fileType,
            fileSizeB: f.fileSizeB
          } : x);
          saveState();
          state.addOpen = false;
          state.editingPost = null;
          showToast("게시물이 수정되었습니다. ✏️");
          return;
        }

        const newPost = {
          id: `type-{Date.now()}`,
          type,
          title: f.title.trim(),
          subject: f.subject,
          content: f.content.trim(),
          grade: Number(f.grade),
          classNum: Number(f.classNum),
          due: f.due,
          bookType: f.bookType,
          file: f.file,
          fileName: f.fileName,
          fileType: f.fileType,
          fileSizeB: f.fileSizeB,
          authorId: state.currentUser.userId,
          authorName: state.currentUser.name,
          authorGrade: state.currentUser.grade,
          authorClass: state.currentUser.classNum,
          authorRole: state.currentUser.role,
          createdAt: Date.now(),
        };

        state.posts[type].unshift(newPost);
        saveState();
        state.aiResult = { ok: true, tag: "검수 통과", reason: verdict.reason };
        render();

        setTimeout(() => {
          state.addOpen = false;
          state.aiResult = null;
          showToast("AI 검수를 통과하여 등록되었습니다. ✅");
        }, 500);
      },
      openDetail(type, id) {
        const p = (state.posts[type] || []).find(x => x.id === id);
        if (p) {
          state.detail = p;
          render();
        }
      },
      closeDetail() {
        state.detail = null;
        render();
      },
      downloadFile(type, id) {
        const p = (state.posts[type] || []).find(x => x.id === id);
        if (!p || !p.file) {
          showToast("첨부된 파일이 없습니다.");
          return;
        }
        const a = document.createElement("a");
        a.href = p.file;
        a.download = p.fileName || "download";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast(`${p.fileName} 다운로드를 시작합니다.`);
      },
      openDeleteConfirm(type, id, title) {
        state.deleteTarget = { type, id, title };
        render();
      },
      closeDeleteConfirm() {
        state.deleteTarget = null;
        render();
      },
      executeDelete() {
        if (!state.deleteTarget) return;
        const { type, id } = state.deleteTarget;
        state.posts[type] = (state.posts[type] || []).filter(x => x.id !== id);
        state.deleteTarget = null;
        state.detail = null;
        saveState();
        showToast("게시물이 삭제되었습니다. 🗑️");
      },
      // 학생 요청
      openRequest(type, id, title) {
        state.requestTarget = { type, id, title };
        state.requestType = "삭제";
        state.requestReason = "";
        state.detail = null;
        render();
      },
      closeRequest() {
        state.requestTarget = null;
        render();
      },
      submitRequest(e) {
        e.preventDefault();
        if (state.requestReason.trim().length < 5) {
          showToast("요청 사유를 5자 이상 구체적으로 적어주세요.");
          return;
        }
        state.requests.unshift({
          id: `req-${Date.now()}`,
          postId: state.requestTarget.id,
          postType: state.requestTarget.type,
          postTitle: state.requestTarget.title,
          kind: state.requestType,
          reason: state.requestReason.trim(),
          requesterName: state.currentUser.name,
          requesterGrade: state.currentUser.grade,
          requesterClass: state.currentUser.classNum,
          status: "pending",
          createdAt: Date.now(),
        });
        state.requestTarget = null;
        saveState();
        showToast("관리자에게 요청이 전송되었습니다. 📬");
      },
      approveRequest(reqId) {
        const req = state.requests.find(r => r.id === reqId);
        if (!req) return;
        const post = (state.posts[req.postType] || []).find(p => p.id === req.postId);
        if (req.kind === "삭제") {
          if (post) {
            state.posts[req.postType] = state.posts[req.postType].filter(p => p.id !== req.postId);
          }
          showToast(post ? "게시물을 삭제 처리했습니다." : "이미 삭제된 게시물입니다.");
        } else {
          if (post) {
            window.app.openEdit(post.type, post.id);
            showToast("수정 모달이 열렸습니다. 내용을 변경해 주세요.");
          } else {
            showToast("대상 게시물이 존재하지 않습니다.");
          }
        }
        req.status = "approved";
        saveState();
        render();
      },
      rejectRequest(reqId) {
        const req = state.requests.find(r => r.id === reqId);
        if (req) {
          req.status = "rejected";
          saveState();
          showToast("요청을 반려했습니다.");
        }
      },
      // 플래너: 할 일
      addTodo(e) {
        e.preventDefault();
        const text = e.target.text.value.trim();
        if (!text) return;
        const planner = state.plannerStore[state.currentUser.userId] || defaultPlanner();
        planner.todos.push({
          id: `t${Date.now()}`,
          text,
          subject: e.target.subject.value,
          book: e.target.book.value.trim(),
          unit: e.target.unit.value.trim(),
          priority: e.target.priority.value,
          done: false,
          date: TODAY
        });
        state.plannerStore[state.currentUser.userId] = planner;
        saveState();
        e.target.reset();
        render();
      },
      toggleTodo(id) {
        const planner = state.plannerStore[state.currentUser.userId];
        if (!planner) return;
        const t = planner.todos.find(x => x.id === id);
        if (t) t.done = !t.done;
        saveState();
        render();
      },
      removeTodo(id) {
        const planner = state.plannerStore[state.currentUser.userId];
        if (!planner) return;
        planner.todos = planner.todos.filter(x => x.id !== id);
        saveState();
        render();
      },
      // 플래너: 오답노트
      addMemo(e) {
        e.preventDefault();
        const title = e.target.title.value.trim();
        const content = e.target.content.value.trim();
        if (!title || !content) {
          showToast("오답노트 제목과 내용을 모두 입력해 주세요.");
          return;
        }
        const planner = state.plannerStore[state.currentUser.userId] || defaultPlanner();
        planner.memos.unshift({
          id: `m${Date.now()}`,
          title,
          content,
          subject: e.target.subject.value,
          createdAt: Date.now()

        state.plannerStore[state.currentUser.userId] = planner;
        saveState();
        e.target.reset();
        showToast("오답노트가 저장되었습니다. 📝");

        planner.memos = planner.memos.filter(x => x.id !== id);

        render();

      addExam() {
        const planner = state.plannerStore[state.currentUser.userId] || defaultPlanner();

        planner.exams.push({ id, name: "새 시험 일정", date: TODAY });

        state.examDraft = { name: "새 시험 일정", date: TODAY };

        saveState();
        render();
      },
      startEditExam(id, name, date) {
        state.editingExam = id;
        state.examDraft = { name, date };
        render();
      },
      cancelEditExam() {
        state.editingExam = null;
        render();
      },
      saveExam(id) {
        if (!state.examDraft.name.trim() || !state.examDraft.date) {
          showToast("시험명과 날짜를 입력해 주세요.");
          return;
        }
        const planner = state.plannerStore[state.currentUser.userId];
        if (!planner) return;
        const ex = planner.exams.find(x => x.id === id);
        if (ex) {
          ex.name = state.examDraft.name.trim();
          ex.date = state.examDraft.date;
        }
        state.editingExam = null;
        saveState();
        showToast("시험 일정이 수정되었습니다.");
      },
      removeExam(id) {
        const planner = state.plannerStore[state.currentUser.userId];
        if (!planner) return;
        planner.exams = planner.exams.filter(x => x.id !== id);
        saveState();
        render();
      },
      // AI 플랜 자동 생성
      generateAIPlan() {
        state.aiLoading = true;
        state.aiPlanMsg = "";
        render();

        setTimeout(() => {
          const planner = state.plannerStore[state.currentUser.userId] || defaultPlanner();
          const sortedExams = [...planner.exams].sort((a, b) => new Date(a.date) - new Date(b.date));
          const nearest = sortedExams.find(e => dday(e.date) >= 0) || sortedExams[0] || null;

          const todayList = planner.todos.filter(t => t.date === TODAY);
          const done = todayList.filter(t => t.done).length;
          const pct = todayList.length ? Math.round((done / todayList.length) * 100) : 0;

          const weak = ["수학", "영어", "국어"][Math.floor(Math.random() * 3)];
          const templates = [
            { text: `${weak} 취약 단원 개념 복습 + 대표 유형 10문항 풀기`, priority: "high" },
            { text: `${weak} 기출/족보 15문항 실전 타이머 풀이 (25분)`, priority: "high" },
            { text: `어제 정리한 오답노트 1회 정독 후 틀린 문항 다시 풀기`, priority: "mid" },
            { text: `핵심 구문 5개 암기 및 백지에 구조 정리하기`, priority: "mid" },
            { text: `${weak} 교과서 본문 2회독 및 단원 요약 노트 작성`, priority: "low" },
          ];
          const picked = templates.sort(() => Math.random() - 0.5).slice(0, 3);

          picked.forEach((tpl, i) => {
            planner.todos.push({
              id: `aiDate.now(){i}`,
              text: tpl.text,
              subject: weak,
              book: "AI 추천",
              unit: nearest ? `${nearest.name} 대비` : "자율 집중",
              priority: tpl.priority,
              done: false,
              date: TODAY,
              ai: true
            });
          });

          state.aiLoading = false;
          state.aiPlanMsg = `현재 진도율(${pct}%)과 nearest?nearest.name:"주요시험"을분석하여[{weak}] 플랜 3개를 추가했습니다.`;
          saveState();
          render();
        }, 850);
      }
    };

                  <button type="button" onclick="app.toggleWelcome(true)" title="공지 팝업"
                    class="px-2.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold transition">
                    📢 공지
                  </button>

                  <button type="button" onclick="app.logout()"
                    class="px-2.5 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-bold border border-rose-200 transition">
                    로그아웃
                  </button>
                </div>
              </div>

              <!-- 탭 네비게이션 -->
              <nav class="flex gap-1 overflow-x-auto no-scrollbar pb-2">
                ${tabs.map(t => `
                  <button type="button" onclick="app.setActiveTab('${t.key}')"
                    class="relative shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition flex items-center gap-1.5 ${state.activeTab === t.key ? 'bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'}">
                    <span>${t.icon}</span>
                    <span>${t.label}</span>
                    ${t.key === 'requests' && pendingCount > 0 ? `
                      <span class="w-4 h-4 rounded-full bg-rose-500 text-white text-[10px] flex items-center justify-center font-bold">
                        ${pendingCount}
                      </span>
                    ` : ''}
                  </button>
                `).join('')}
              </nav>
            </div>
          </header>

          <!-- 메인 콘텐츠 영역 -->
          <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 pb-28 flex-1 w-full">
            ${state.activeTab === 'planner' ? renderPlannerTab(todayTodos, progress, doneCount, sortedExams, nearestExam, planner) : ''}
            ${POST_TABS.includes(state.activeTab) ? renderPostsTab(currentTab, visiblePosts, isAdmin, user) : ''}
            ${state.activeTab === 'requests' && isAdmin ? renderRequestsTab() : ''}
          </main>

          <!-- 모달 컴포넌트 렌더링 -->
          ${state.showWelcome ? renderWelcomeModal(user, isAdmin, progress, todayTodos, doneCount, nearestExam) : ''}
          ${state.detail ? renderDetailModal(isAdmin) : ''}
          ${state.addOpen ? renderAddModal(currentTab, isAdmin, user) : ''}
          ${state.requestTarget ? renderRequestModal() : ''}
          ${state.deleteTarget ? renderDeleteConfirmModal() : ''}

          <!-- 플로팅 실시간 위젯 -->
          ${renderFloatingWidget(progress, doneCount, todayTodos, nearestExam)}
          ${renderToast()}
        </div>
      `;
    }

    /* ==========================================================================
       하위 렌더링 함수들
       ========================================================================== */

    function renderProgressBar(pct) {
      return `
        <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
          <div class="bg-gradient-to-r from-indigo-500 to-violet-600 h-2.5 rounded-full transition-all duration-300" style="width: ${Math.min(Math.max(pct, 0), 100)}%"></div>
        </div>
      `;
    }

    function renderToast() {
      if (!state.toast) return "";
      return `
        <div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-2xl bg-slate-900/90 text-white text-xs font-semibold shadow-xl backdrop-blur animate-pop">
          ${escapeHtml(state.toast)}
        </div>
      `;
    }

    function renderPlannerTab(todayTodos, progress, doneCount, sortedExams, nearestExam, planner) {
      return `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <section class="lg:col-span-2 space-y-6">
            <!-- 오늘의 목표 카드 -->
            <div class="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm">
              <div class="flex items-center justify-between mb-4">
                <div>
                  <h2 class="text-base font-extrabold text-slate-900">오늘의 학습 목표</h2>
                  <p class="text-xs text-slate-500 mt-0.5">${fmtDate(TODAY)} · 목표 진도율 관리</p>
                </div>
                <button type="button" onclick="app.generateAIPlan()" ${state.aiLoading ? 'disabled' : ''}
                  class="px-3 py-1.5 rounded-xl bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white text-xs font-bold shadow-md shadow-violet-500/20 disabled:opacity-60 transition">
                  ${state.aiLoading ? 'AI 분석 중...' : '✨ AI 맞춤 플랜 생성'}
                </button>
              </div>

              <div class="bg-slate-50 rounded-2xl p-4 border border-slate-100 mb-4">
                <div class="flex justify-between items-center mb-1.5">
                  <span class="text-xs font-bold text-slate-700">달성률</span>
                  <span class="text-sm font-extrabold text-indigo-600">${progress}%</span>
                </div>
                ${renderProgressBar(progress)}
                <p class="text-[11px] text-slate-500 mt-1.5">
                  총 todayTodos.length개목표중<bclass="text-slate-800">{doneCount}개 완료</b>
                </p>
              </div>

              ${state.aiPlanMsg ? `
                <div class="mb-4 p-3 rounded-xl bg-violet-50 border border-violet-200 text-violet-800 text-xs">
                  ✨ ${escapeHtml(state.aiPlanMsg)}
                </div>
              ` : ''}

              <!-- 할 일 추가 폼 -->
              <form onsubmit="app.addTodo(event)" class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200 mb-4">
                <input name="text" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-white text-slate-900 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none mb-2"
                  placeholder="할 일 입력 (예: 수학 쎈 3단원 25~40번 풀기)" />
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-2">
                  <select name="subject" class="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-slate-900 text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    ${SUBJECTS.map(s => `<option value="${s}">${s}</option>`).join('')}
                  </select>
                  <input name="book" placeholder="교재명 (선택)" class="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-slate-900 text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
                  <input name="unit" placeholder="단원 (선택)" class="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-slate-900 text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
                  <select name="priority" class="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-slate-900 text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    ${PRIORITIES.map(p => `<option value="${p.key}" ${p.key === 'mid' ? 'selected' : ''}>우선순위: ${p.label}</option>`).join('')}
                  </select>
                </div>
                <button type="submit" class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold transition">
                  + 오늘 목표 추가하기
                </button>
              </form>

              <!-- 할 일 목록 -->
              <ul class="space-y-2">
                ${todayTodos.length === 0 ? `
                  <li class="text-center py-8 text-slate-400 text-xs">
                    <span class="text-2xl block mb-1">📌</span>등록된 목표가 없습니다. 오늘 할 일을 추가해 보세요!
                  </li>
                ` : todayTodos.map(t => {
                  const pr = PRIORITIES.find(p => p.key === t.priority) || PRIORITIES[1];
                  return `
                    <li class="flex items-start gap-3 p-3 rounded-2xl border transition ${t.done ? 'bg-slate-50 border-slate-200' : 'bg-white border-slate-200 hover:border-indigo-300 shadow-sm'}">
                      <button type="button" onclick="app.toggleTodo('${t.id}')"
                        class="mt-0.5 w-5 h-5 shrink-0 rounded-md border-2 flex items-center justify-center transition text-xs font-bold ${t.done ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-300 hover:border-indigo-500'}">
                        ${t.done ? '✓' : ''}
                      </button>
                      <div class="flex-1 min-w-0">
                        <p class="text-sm font-semibold leading-snug ${t.done ? 'line-through text-slate-400' : 'text-slate-800'}">
                          t.ai?'<spanclass="text-violet-600font-boldmr-1">✨[AI]</span>':''{escapeHtml(t.text)}
                        </p>
                        <div class="flex flex-wrap items-center gap-2 mt-1.5 text-xs text-slate-500">
                          <span class="px-1.5 py-0.5 rounded bg-slate-100 text-slate-700 font-semibold">${escapeHtml(t.subject)}</span>
                          ${t.book ? `<span>📖 ${escapeHtml(t.book)}</span>` : ''}
                          ${t.unit ? `<span>• ${escapeHtml(t.unit)}</span>` : ''}
                          <span class="px-1.5 py-0.5 rounded text-[10px] font-bold border pr.chip">{pr.label}</span>
                        </div>
                      </div>
                      <button type="button" onclick="app.removeTodo('${t.id}')" title="삭제"
                        class="shrink-0 w-7 h-7 grid place-items-center rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition">
                        🗑️
                      </button>
                    </li>
                  `;
                }).join('')}
              </ul>
            </div>

            <!-- 오답 노트 카드 -->
            <div class="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm">
              <h2 class="text-base font-extrabold text-slate-900">개인 메모장 · 오답 노트</h2>
              <p class="text-xs text-slate-500 mt-0.5 mb-4">틀린 원인과 복습 포인트를 기록해 두세요.</p>

              <form onsubmit="app.addMemo(event)" class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200 mb-4">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 mb-2">
                  <input name="title" required placeholder="오답 제목 (예: 수학 - 삼각함수 주기 공식 실수)"
                    class="sm:col-span-2 px-3 py-2 rounded-xl border border-slate-300 bg-white text-slate-900 text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
                  <select name="subject" class="px-3 py-2 rounded-xl border border-slate-300 bg-white text-slate-900 text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    ${SUBJECTS.map(s => `<option value="${s}">${s}</option>`).join('')}
                  </select>
                </div>
                <textarea name="content" required rows="3" placeholder="틀린 이유, 올바른 풀이 접근법 등을 메모하세요."
                  class="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-slate-900 text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none resize-none mb-2"></textarea>
                <button type="submit" class="w-full py-2 rounded-xl bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold transition">
                  + 오답노트 저장하기
                </button>
              </form>

              <div class="space-y-3">
                ${planner.memos.length === 0 ? `
                  <p class="text-center py-6 text-slate-400 text-xs">작성된 오답노트가 없습니다.</p>
                ` : planner.memos.map(m => `
                  <div class="p-4 rounded-2xl bg-amber-50/40 border border-amber-200/80 relative">
                    <div class="flex items-start justify-between gap-2">
                      <div>
                        <span class="px-1.5 py-0.5 rounded bg-amber-100 text-amber-800 text-[10px] font-bold">${escapeHtml(m.subject)}</span>
                        <h3 class="font-bold text-slate-900 text-sm mt-1">${escapeHtml(m.title)}</h3>
                      </div>
                      <button type="button" onclick="app.removeMemo('${m.id}')" title="삭제"
                        class="w-7 h-7 grid place-items-center rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition">
                        🗑️
                      </button>
                    </div>
                    <p class="text-xs text-slate-700 mt-2 whitespace-pre-wrap leading-relaxed">${escapeHtml(m.content)}</p>
                    <span class="text-[10px] text-amber-800/60 mt-2 block">${new Date(m.createdAt).toLocaleDateString("ko-KR")}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </section>

          <!-- 우측 사이드바: 시험 D-Day -->
          <aside class="space-y-6">
            <div class="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm">
              <div class="flex items-center justify-between mb-3">
                <h2 class="text-base font-extrabold text-slate-900">주요 시험 D-Day</h2>
                <button type="button" onclick="app.addExam()"
                  class="px-2 py-1 rounded-lg bg-indigo-50 text-indigo-700 text-xs font-bold hover:bg-indigo-100 transition">
                  + 추가
                </button>
              </div>

              <ul class="space-y-2.5">
                ${sortedExams.map(ex => {
                  const d = dday(ex.date);
                  const urgent = d !== null && d >= 0 && d <= 7;
                  if (state.editingExam === ex.id) {
                    return `
                      <li class="p-3 rounded-xl border border-indigo-300 bg-indigo-50/50">
                        <input class="w-full px-2.5 py-1.5 rounded-lg border border-slate-300 text-xs mb-1.5 bg-white"
                          value="${escapeHtml(state.examDraft.name)}" oninput="state.examDraft.name = this.value" placeholder="시험 이름" />
                        <input type="date" class="w-full px-2.5 py-1.5 rounded-lg border border-slate-300 text-xs mb-2 bg-white"
                          value="${state.examDraft.date}" oninput="state.examDraft.date = this.value" />
                        <div class="flex gap-2">
                          <button type="button" onclick="app.saveExam('${ex.id}')"
                            class="flex-1 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-bold hover:bg-indigo-700">저장</button>
                          <button type="button" onclick="app.cancelEditExam()"
                            class="flex-1 py-1.5 rounded-lg bg-white border border-slate-300 text-slate-600 text-xs font-bold">취소</button>
                        </div>
                      </li>
                    `;
                  }
                  return `
                    <li class="p-3 rounded-2xl border transition flex items-center justify-between ${urgent ? 'bg-rose-50 border-rose-200' : 'bg-slate-50 border-slate-200 hover:border-slate-300'}">
                      <div class="min-w-0 pr-2">
                        <p class="font-bold text-slate-900 text-xs truncate">${escapeHtml(ex.name)}</p>
                        <p class="text-[11px] text-slate-500 mt-0.5">${fmtDate(ex.date)}</p>
                      </div>
                      <div class="flex items-center gap-1.5">
                        <span class="px-2 py-1 rounded-lg text-xs font-black ${urgent ? 'bg-rose-600 text-white' : 'bg-indigo-100 text-indigo-700'}">
                          ${ddayLabel(d)}
                        </span>
                        <button type="button" onclick="app.startEditExam('ex.id','{escapeHtml(ex.name)}', '${ex.date}')" title="수정"
                          class="w-7 h-7 grid place-items-center rounded-lg hover:bg-white text-slate-400 hover:text-slate-700">
                          ✏️
                        </button>
                        <button type="button" onclick="app.removeExam('${ex.id}')" title="삭제"
                          class="w-7 h-7 grid place-items-center rounded-lg hover:bg-white text-slate-400 hover:text-rose-600">
                          🗑️
                        </button>
                      </div>
                    </li>
                  `;
                }).join('')}
                ${sortedExams.length === 0 ? `<li class="text-center py-6 text-slate-400 text-xs">등록된 시험 일정이 없습니다.</li>` : ''}
              </ul>
            </div>

            <div class="bg-gradient-to-br from-indigo-900 to-violet-900 text-white rounded-3xl p-5 shadow-lg shadow-indigo-900/20">
              <p class="text-indigo-200 text-xs font-bold mb-1.5">💡 오늘의 한마디</p>
              <p class="font-bold leading-relaxed text-sm">
                “${nearestExam ? `${escapeHtml(nearestExam.name)}까지 ${Math.max(dday(nearestExam.date), 0)}일 남았습니다. ` : ''}
                지금 집중한 1시간이 시험장의 10분을 바꿉니다.”
              </p>
            </div>
          </aside>
        </div>
      `;
    }

    function renderPostsTab(currentTab, visiblePosts, isAdmin, user) {
      return `
        <section>
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6 bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
            <div>
              <h2 class="text-lg font-extrabold text-slate-900 flex items-center gap-2">
                <span>${currentTab.icon}</span> ${currentTab.label}
              </h2>
              <p class="text-xs text-slate-500 mt-1">
                ${isAdmin ? `
                  <span>관리자 모드: 전 학년·반 게시물 열람 및 관리 가능 (총 ${visiblePosts.length}건)</span>
                ` : `
                  <span>user.grade학년공통및<bclass="text-emerald-600">{user.grade}학년 ${user.classNum}반 전용</b> 자료만 자동 표시됩니다. (총 ${visiblePosts.length}건)</span>
                `}
              </p>
            </div>

            <button type="button" onclick="app.openAdd()"
              class="shrink-0 px-4 py-2.5 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 text-white text-xs font-bold shadow-md shadow-indigo-500/20 hover:opacity-95 transition">
              + 새 항목 등록
            </button>
          </div>

          <div class="p-3 bg-indigo-50/70 border border-indigo-200/80 rounded-2xl mb-5 text-xs text-indigo-900 flex items-center justify-between">
            <span>🤖 AI 검수 시스템이 장난성/비학습용 게시물을 자동 필터링합니다.</span>
            ${!isAdmin ? `<span class="text-indigo-600 font-semibold">게시물 삭제/수정은 📬 요청 기능을 이용하세요.</span>` : ''}
          </div>

          ${visiblePosts.length === 0 ? `
            <div class="bg-white rounded-3xl p-10 border border-slate-200 text-center">
              <span class="text-4xl block mb-2">📂</span>
              <p class="text-slate-500 text-sm">표시할 항목이 없습니다. 첫 번째 자료를 등록해 보세요!</p>
            </div>
          ` : `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${visiblePosts.map(post => {
                const common = Number(post.classNum) === 0;
                return `
                  <article onclick="app.openDetail('post.type','{post.id}')"
                    class="cursor-pointer bg-white rounded-3xl border border-slate-200 p-5 hover:border-indigo-400 hover:shadow-md transition flex flex-col justify-between">
                    <div>
                      <div class="flex items-start justify-between gap-2 mb-2">
                        <div class="flex flex-wrap items-center gap-1.5">
                          <span class="px-2 py-0.5 rounded-md text-[11px] font-bold border ${common ? 'bg-indigo-50 text-indigo-700 border-indigo-200' : 'bg-emerald-50 text-emerald-700 border-emerald-200'}">
                            ${post.grade}학년 ${common ? '공통' : `${post.classNum}반 전용`}
                          </span>
                          <span class="px-2 py-0.5 rounded-md text-[11px] font-bold bg-slate-100 text-slate-700">
                            ${escapeHtml(post.subject)}
                          </span>
                          ${post.bookType ? `
                            <span class="px-2 py-0.5 rounded-md text-[11px] font-bold bg-amber-50 text-amber-700 border border-amber-200">
                              ${escapeHtml(post.bookType)}
                            </span>
                          ` : ''}
                        </div>

                        ${isAdmin ? `
                          <div class="flex items-center gap-1" onclick="event.stopPropagation()">
                            <button type="button" title="수정" onclick="app.openEdit('post.type','{post.id}')"
                              class="w-7 h-7 grid place-items-center rounded-lg text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 transition">✏️</button>
                            <button type="button" title="삭제" onclick="app.openDeleteConfirm('post.type','{post.id}', '${escapeHtml(post.title)}')"
                              class="w-7 h-7 grid place-items-center rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition">🗑️</button>
                          </div>
                        ` : `
                          <button type="button" title="관리자에게 삭제/수정 요청" onclick="event.stopPropagation(); app.openRequest('post.type','{post.id}', '${escapeHtml(post.title)}')"
                            class="w-7 h-7 grid place-items-center rounded-lg text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 transition text-xs">
                            📬
                          </button>
                        `}
                      </div>

                      <h3 class="font-bold text-slate-900 text-sm leading-snug hover:text-indigo-600 transition">
                        ${escapeHtml(post.title)}
                      </h3>
                      <p class="text-xs text-slate-600 mt-2 line-clamp-2 leading-relaxed">
                        ${escapeHtml(post.content || "상세 설명이 없습니다.")}
                      </p>

                      ${post.type === "assignments" && post.due ? `
                        <div class="mt-3 p-2.5 rounded-xl bg-rose-50 border border-rose-100 flex items-center justify-between text-xs">
                          <span class="text-rose-700 font-semibold">마감: ${fmtDateTime(post.due)}</span>
                          <span class="font-black text-rose-600 bg-white px-2 py-0.5 rounded-md border border-rose-200">
                            ${ddayLabel(dday(post.due))}
                          </span>
                        </div>
                      ` : ''}

                      ${post.type === "materials" && post.fileName ? `
                        <div class="mt-3 p-2 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between text-xs text-slate-600">
                          <span class="truncate">📎 ${escapeHtml(post.fileName)}</span>
                          <span class="text-[10px] text-slate-400 shrink-0">${fmtSize(post.fileSizeB)}</span>
                        </div>
                      ` : ''}
                    </div>

                    <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400">
                      <span class="${post.authorRole === 'admin' ? 'text-violet-600 font-semibold' : 'text-slate-500'}">
                        ${post.authorRole === 'admin' ? `관리자 escapeHtml(post.authorName)`:`{post.authorGrade}학년 ${post.authorClass}반 ${escapeHtml(post.authorName)}`}
                      </span>
                      <span>${new Date(post.createdAt).toLocaleDateString("ko-KR")}</span>
                    </div>
                  </article>
                `;
              }).join('')}
            </div>
          `}
        </section>
      `;
    }

    function renderRequestsTab() {
      return `

                  class="px-4 py-2.5 rounded-xl bg-indigo-50 border border-indigo-200 text-indigo-700 font-bold text-xs hover:bg-indigo-100 transition">

          </div>
        </div>
      `;

            <h3 class="text-base font-extrabold text-slate-900 mb-2">게시물 삭제 확인</h3>
            <p class="text-xs text-slate-600 leading-relaxed mb-4">
              “${escapeHtml(target.title)}” 게시물을 삭제하시겠습니까? 삭제된 자료는 복구할 수 없습니다.
            </p>
            <div class="flex gap-2">
              <button type="button" onclick="app.executeDelete()"
                class="flex-1 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs transition">
                삭제하기
              </button>
              <button type="button" onclick="app.closeDeleteConfirm()"
                class="flex-1 py-2 rounded-xl bg-white border border-slate-300 text-slate-700 font-bold text-xs">
                취소
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderFloatingWidget(progress, doneCount, todayTodos, nearestExam) {
      const remaining = todayTodos.length - doneCount;
      return `
        <div class="fixed bottom-5 right-5 z-40 flex flex-col items-end">
          ${state.showWidget ? `
            <div class="mb-3 w-72 bg-white rounded-3xl p-4 shadow-2xl border border-slate-200 animate-pop">
              <div class="flex justify-between items-center pb-2 border-b border-slate-100 mb-2">
                <span class="text-xs font-bold text-slate-800">📊 실시간 학습 요약</span>
                <button type="button" onclick="app.toggleWidget()" class="text-slate-400 hover:text-slate-700 text-xs">✕</button>
              </div>
              <div class="mb-3">
                <div class="flex justify-between text-xs mb-1">
                  <span class="text-slate-500">진도율</span>
                  <span class="font-bold text-indigo-600">${progress}%</span>
                </div>
                ${renderProgressBar(progress)}
                <span class="text-[10px] text-slate-400 mt-1 block">doneCount/{todayTodos.length}개 완료</span>
              </div>
              ${nearestExam ? `
                <div class="p-2.5 rounded-xl bg-rose-50 border border-rose-100 flex justify-between items-center text-xs">
                  <span class="truncate font-semibold text-rose-900">${escapeHtml(nearestExam.name)}</span>
                  <span class="font-black text-rose-600 shrink-0">${ddayLabel(dday(nearestExam.date))}</span>
                </div>
              ` : ''}
            </div>
          ` : ''}
          <button type="button" onclick="app.toggleWidget()"
            class="w-12 h-12 rounded-full bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-xl shadow-indigo-600/30 font-bold text-base hover:scale-105 active:scale-95 transition flex items-center justify-center relative">
            ${state.showWidget ? '✕' : '📊'}
            ${!state.showWidget && remaining > 0 ? `
              <span class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-rose-500 text-white text-[10px] font-black flex items-center justify-center border-2 border-white">
                ${remaining}
              </span>
            ` : ''}
          </button>
        </div>
      `;
    }

    // 8. 초기 구동 실행
    window.addEventListener("DOMContentLoaded", () => {
      render();
    });
    // DOM이 이미 로드된 상태인 경우 즉시 렌더링
    if (document.readyState === "complete" || document.readyState === "interactive") {
      render();
    }
  </script>
</body>
</html>
